# Builds the plugin on every push and attaches the .wasm to GitHub Releases
# when you push a tag (e.g. `v0.1.0`). Optional — delete this file if you
# build elsewhere or not in CI. Nothing here is required to build locally.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the channel + the wasm32-wasip2 target, so the
      # standard toolchain action installs exactly what's needed.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - run: ./build.sh
      # Every build uploads the artifact so you can download it from the run.
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-wasm
          path: dist/*.wasm
      # Tag pushes also attach it to a Release.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.wasm
