# Build check — proves the plugin compiles to a component on every push/PR.
# Releasing is handled separately by release.yml (on a version bump).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No toolchain action needed: the runner's rustup reads
      # rust-toolchain.toml and auto-installs the pinned channel + the
      # wasm32-wasip2 target on the first cargo invocation.
      - run: ./build.sh
      # Make the built component downloadable from the run (handy for testing
      # a branch before you cut a release).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-wasm
          path: dist/*.wasm
