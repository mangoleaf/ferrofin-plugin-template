# Build check — proves the plugin compiles to a component on every push/PR.
# Releasing is handled separately by release.yml (on a version bump).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # rust-toolchain.toml pins the channel + the wasm32-wasip2 target.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned
        with:
          targets: wasm32-wasip2
      - run: ./build.sh
      # Make the built component downloadable from the run (handy for testing
      # a branch before you cut a release).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-wasm
          path: dist/*.wasm
